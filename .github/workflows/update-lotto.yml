name: Update lotto history
on:
  workflow_dispatch:
  schedule:
    # UTC Saturday 13:15 / Sunday 00:15 / Sunday 06:15 => KST 22:15, 09:15, 15:15
    - cron: '15 13 * * 6'
    - cron: '15 0,6 * * 0'
permissions:
  contents: write
concurrency:
  group: lotto-data-update
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate all drawings
        run: node scripts/sync-lotto.mjs
        env:
          FORCE_SYNC: '1'
      - name: Commit data if changed
        run: |
          if git diff --quiet -- public/data; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/history.json public/data/stats.json public/data/latest.json
          git commit -m 'data: refresh verified lotto drawings'
          git push
